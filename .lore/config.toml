# .lore/config.toml — lore's own configuration.
#
# Most keys are optional. This repository cut over LCLI's live tasks from
# Backlog to Quest on 2026-09-03 (see .quest/workspace.toml and
# docs/reference/backlog-to-quest-cutover-runbook.md, opum-agent/dev). The
# 297 excluded LORE-family records were all proven non-unique (twins in the
# migrated LCLI family, or an archived draft against an already-retired
# subsystem) and removed at commit f84f586; they remain in git history, not
# on disk. See docs/adr/0013-lore-state-directory.md for the full
# tracker-backend contract.
#
# This file sets exactly three non-default values, and test/config.test.ts pins
# that list so a fourth cannot arrive silently: tracker.backend = "quest" (the
# 2026-09-03 cutover above), agents.skill_source = "plugin" (LCLI-444), and the
# [reconcile.overrides] entry below, which is TEMPORARY and names its own
# removal condition at the site (LCLI-504).
#
# The Confluence API token is NEVER stored here — it is read only from
# $LORE_CONFLUENCE_TOKEN, and a token committed under [confluence] is rejected
# with a fail-loud validation error.

[tracker]
backend = "quest"

[reconcile]
# Status roll-up policy for `lore sync` / `lore check`:
# all tasks Done -> done; any In Progress -> in-progress; else todo.
mode = "task-rollup"

[reconcile.overrides]
# Quest 0.7.0 renamed its paused status "Blocked" -> "Paused". LCLI-333 was
# parked under the old literal and is STRANDED there: on quest 0.7.0 a record
# at "Blocked" cannot leave it -- task pause, task start and edit --status are
# each refused, and edit to "Paused" is refused by design. Measured by lore-web
# on 0.7.0; LWEB-80 and QCLI-271 are stranded the same way, and quest-cli has
# ruled the fix ahead of its other work as 0.7.1.
#
# "in-progress" is not a guess: it is exactly what lore's own classify() gives
# a status matching the backend's pausedStatus (LCLI-455), so this override
# produces the SAME rollup the record will produce once it reaches "Paused".
# The override is a stand-in for the rename, not a reinterpretation of it.
#
# REMOVE THIS once quest 0.7.1 installs and LCLI-333 moves to "Paused"
# (LCLI-504 AC#2). Left in place it would silently keep classifying a literal
# no conformant quest can emit any more.
"Blocked" = "in-progress"

[validate]
external_links = false      # external-link liveness is opt-in (`lore check --external`)
promote_portability = false # the portability lint stays a warning, not an error

# [confluence] — omitted: lore does not publish to Confluence (the one-way
# publish adapter is deferred, LCLI-43). When enabled, set base_url / space /
# parent_page_id / format here and provide the token via $LORE_CONFLUENCE_TOKEN.

# [tracker.jira] — omitted: this repository explicitly uses Quest. When
# enabled, set profile / project / board / issue_type /
# default_labels / status_flow here. jira-cli owns credentials; run
# `jira init --yes` instead of storing any Jira credential in this file.

[agents]
# This repository opted into the opum-lore marketplace plugin (LCLI-441) owning
# .claude/skills/lore/SKILL.md on 2026-09-05, dogfooding LCLI-443's opt-in (LCLI-444):
# `lore agents --check` treats a leftover per-repo SKILL.md as drift, and `--force`
# removes one only when its bytes exactly match this CLI's own generated content.
skill_source = "plugin"
