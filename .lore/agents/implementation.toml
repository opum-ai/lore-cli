schema_version = 1
name = "implementation"
description = "Grounds lore-cli feature work in the CLI contract that binds every command's flags, output envelope and exit codes, the OKF substrate underneath it, and the architectural constraints a change is not allowed to relax."
kind = "specialist"
# Holds this profile's COMPLETE declared set, as a real pack renders it (LCLI-642, DEC-11: a profile
# whose declared sources cannot fit its budget is the `lore check` finding `agent-profile-capacity`).
# The headroom above that measurement covers document growth plus the one thing it still does not
# count -- the pack header's task line, which grows with the task text -- so a real task's pack
# within the header allowance still holds every declared candidate. Since LCLI-662 (DEC-98 B,
# ADR-0025) the measurement reserves the bundle-wide query section's worst case and renders score
# annotations at full width. No number is written here on purpose: it moves with
# every edit to a declared source. `lore check` prints the current requirement when it is exceeded.
max_tokens = 111000
pinned = [
  "reference/cli-contract#1-output-modes-and-precedence",
  "reference/cli-contract#22-relationship-to-the-backlogmd-envelope",
  "reference/cli-contract#51-semantic-exit-codes",
  "reference/cli-contract#52-the---json-error-envelope",
  "reference/cli-contract#53-error_type--exit-code-alignment",
]
sources = [
  "specs/lore-design",
  "reference/architecture",
  "reference/cli-surface",
  "reference/tech-stack",
  "reference/okf-projection-contract",
  "specs/agent-profile-context-retrieval",
  "specs/workspace-indexing-and-retrieval",
  "adr/0005-cli-contract",
  "adr/0007-validation-and-coherence",
  "adr/0011-frontmatter-serialization-stability",
  "adr/0013-lore-state-directory",
  "adr/0014-core-has-no-llm-dependency",
  "adr/0018-persistent-local-graph-projection-with-ladybugdb",
]

# Context-budget TARGETS the compiler measures a compiled pack against and reports (MDL-7,
# ODOC-437 AC3). Design defaults, NOT ceilings enforced before a request -- `max_tokens` above
# stays the ceiling. The initial code map and the harness/tools floor of the total startup are
# composed by opum-cli and are reported not-applicable by lore.
[targets]
policy_and_role = 3000
task_contract = 2000
task_evidence = 6000
lore_subtotal = 11000
