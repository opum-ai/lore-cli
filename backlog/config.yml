# lore coexistence contract (ADR-0012): lore is the sole committer of backlog/.
# auto_commit, check_active_branches, and remote_operations MUST stay false for
# deterministic, offline, current-branch-only reads; this repo dogfoods its own
# contract. NOTE: `backlog config set` rewrites this file from a comment-less
# template, so this note is best-effort and may not survive — the durable record
# is the ADR, and a `lore check` exit-6 drift gate will enforce the invariant once
# LORE-27 lands. See docs/adr/0012-backlog-coexistence-git-ownership.md.
project_name: "lore-cli"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "LCLI"
