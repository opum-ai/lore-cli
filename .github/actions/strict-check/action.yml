name: Strict Lore check
description: >
  Run the Lore source from this immutable action revision against a checked-out
  caller repository. Consumers must pin the action to a full commit SHA.

inputs:
  working-directory:
    description: Repository-relative bundle root to validate.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Set up pinned Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.2.23

    - name: Install pinned Lore dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: bun install --frozen-lockfile --linker=isolated

    - name: Build pinned JSON-capable Backlog CLI
      shell: bash
      env:
        BACKLOG_COMMIT: 22a091b570d44c4f302ca47e7fd36fa28ad8bcb0
      run: |
        BACKLOG_SOURCE_DIR="$(mktemp -d "${RUNNER_TEMP}/lore-backlog.XXXXXX")"
        BACKLOG_BIN_DIR="${RUNNER_TEMP}/lore-bin"

        git init --quiet "$BACKLOG_SOURCE_DIR"
        git -C "$BACKLOG_SOURCE_DIR" remote add origin https://github.com/MrLesk/Backlog.md.git
        git -C "$BACKLOG_SOURCE_DIR" fetch --quiet --depth=1 origin "$BACKLOG_COMMIT"
        git -C "$BACKLOG_SOURCE_DIR" checkout --quiet --detach FETCH_HEAD

        (
          cd "$BACKLOG_SOURCE_DIR"
          HUSKY=0 bun install
          HUSKY=0 bun run build
        )

        mkdir -p "$BACKLOG_BIN_DIR"
        install -m 0755 "$BACKLOG_SOURCE_DIR/dist/backlog" "$BACKLOG_BIN_DIR/backlog"
        BACKLOG_VERSION="$("$BACKLOG_BIN_DIR/backlog" --version)"
        if [[ -z "$BACKLOG_VERSION" || "$BACKLOG_VERSION" == "0.0.0" ]]; then
          echo "Pinned Backlog build produced an invalid version: '$BACKLOG_VERSION'" >&2
          exit 1
        fi
        echo "$BACKLOG_BIN_DIR" >> "$GITHUB_PATH"

    - name: Validate OKF documents
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      env:
        LORE_ACTION_ENTRYPOINT: ${{ github.action_path }}/../../../src/cli.ts
      run: bun "$LORE_ACTION_ENTRYPOINT" validate --strict

    - name: Check Lore coherence
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      env:
        LORE_ACTION_ENTRYPOINT: ${{ github.action_path }}/../../../src/cli.ts
      run: bun "$LORE_ACTION_ENTRYPOINT" check --strict
