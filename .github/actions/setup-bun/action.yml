name: Set up Bun + install
description: >
  Shared setup-bun / cache-restore / frozen-install sequence, used identically by every job
  across ci.yml and release.yml that needs a working Bun toolchain, so the version pin, cache
  key, and install flags (--frozen-lockfile --linker=isolated) live in exactly one place
  instead of being hand-typed in every job. Callers must `actions/checkout@v6` FIRST — a local
  composite action can't be resolved before its own repo checkout has happened.
inputs:
  ignore-scripts:
    description: Skip dependency lifecycle scripts on hosts with deliberately unsupported native dependencies.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
    - if: inputs.ignore-scripts != 'true'
      run: bun install --frozen-lockfile --linker=isolated
      shell: bash
    - if: inputs.ignore-scripts == 'true'
      run: bun install --frozen-lockfile --linker=isolated --ignore-scripts
      shell: bash
