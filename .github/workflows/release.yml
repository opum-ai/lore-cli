name: Release (dry-run)

# Manual-only trigger (workflow_dispatch) — never fires on a push or tag, so simply
# committing/tagging code can never kick off a release. `publish` defaults to false
# and, as of this workflow, publishing is not wired at all (see the TODO at the
# bottom): this workflow only builds and packages every platform artifact and
# proves the npx/launcher mechanism resolves the right binary end-to-end
# (LORE-9 AC#1/AC#2). See docs/runbooks/release-publishing.md for what a maintainer
# still needs to configure on npmjs.com before a real publish step can be added.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Reserved for a future publish step (not implemented yet — see docs/runbooks/release-publishing.md). Has no effect today."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    name: resolve the release platform matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      names: ${{ steps.matrix.outputs.names }}
      namesSpace: ${{ steps.matrix.outputs.namesSpace }}
    steps:
      - id: matrix
        # The ONE place the five platform triples are declared (ADR-0001 §"Build"; x64
        # targets are -baseline to avoid AVX2-only SIGILL on older/virtualized CPUs, arm64
        # is standard). `build`'s matrix, `verify-versions`, and `package`'s per-platform
        # loop all derive their platform list from this job's outputs instead of each
        # re-typing it — a platform added/removed here propagates everywhere automatically.
        # `namesSpace` is the same list pre-joined space-separated for `for name in ...`
        # shell loops, computed once here rather than re-decoded from `names` (JSON) in
        # every consuming step.
        run: |
          matrix='[{"name":"darwin-arm64","target":"bun-darwin-arm64","binary":"lore"},{"name":"darwin-x64","target":"bun-darwin-x64-baseline","binary":"lore"},{"name":"linux-arm64","target":"bun-linux-arm64","binary":"lore"},{"name":"linux-x64","target":"bun-linux-x64-baseline","binary":"lore"},{"name":"win32-x64","target":"bun-windows-x64-baseline","binary":"lore.exe"}]'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          names=$(node -e "console.log(JSON.stringify(JSON.parse(process.argv[1]).map((p) => p.name)))" "$matrix")
          echo "names=$names" >> "$GITHUB_OUTPUT"
          namesSpace=$(node -e "console.log(JSON.parse(process.argv[1]).map((p) => p.name).join(' '))" "$matrix")
          echo "namesSpace=$namesSpace" >> "$GITHUB_OUTPUT"

  verify-versions:
    name: assert the six release packages are version + metadata consistent
    needs: setup
    runs-on: ubuntu-latest
    env:
      PLATFORM_NAMES: ${{ needs.setup.outputs.names }}
    steps:
      - uses: actions/checkout@v6
      - name: Assert version, license, author, repository, and the optionalDependencies pin all match
        # bin/lore.cjs resolves a platform optionalDependency purely by name; npm silently
        # SKIPS it if the installed version doesn't satisfy root's pinned range — for an
        # exact pin, "doesn't exactly match." A missed version bump on any of: the root
        # `version`, a platform package's `version`, or root's `optionalDependencies` pin
        # for that package, would surface as "no compiled binary found" for a fully
        # supported platform, indistinguishable from a genuinely unsupported one. license/
        # author/repository drift is lower-stakes (cosmetic/registry-page metadata) but
        # checked here too since it is duplicated the same way. Fail loud, before any
        # compile work, naming every mismatch found (not just the first).
        run: |
          # The ${...} below are JS template literals for `node -e`, not shell
          # interpolation — single-quoting is intentional.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const platforms = JSON.parse(process.env.PLATFORM_NAMES);
            const fields = ["version", "license", "author"];
            const problems = [];
            for (const name of platforms) {
              const pkg = JSON.parse(fs.readFileSync(`npm/${name}/package.json`, "utf8"));
              for (const field of fields) {
                if (pkg[field] !== root[field]) {
                  problems.push(`npm/${name}/package.json: ${field} is "${pkg[field]}", root is "${root[field]}"`);
                }
              }
              if (JSON.stringify(pkg.repository) !== JSON.stringify(root.repository)) {
                problems.push(`npm/${name}/package.json: repository does not match root`);
              }
              const pin = root.optionalDependencies && root.optionalDependencies[pkg.name];
              if (pin !== pkg.version) {
                problems.push(`root package.json optionalDependencies["${pkg.name}"] is "${pin}", but npm/${name}/package.json version is "${pkg.version}"`);
              }
            }
            if (problems.length > 0) {
              for (const p of problems) console.error(`::error::${p}`);
              process.exit(1);
            }
            console.log(`all six release packages are consistent (version ${root.version})`);
          '

  build:
    name: "compile (${{ matrix.name }})"
    needs: [setup, verify-versions]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    # Cross-compiling all five targets from one ubuntu runner (verified locally,
    # LORE-9): Bun downloads the target runtime and compiles without needing a
    # matching host OS/arch. Only linux-x64 matches this runner natively, so it is
    # the one target actually executed below; the rest get a non-empty-file check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --linker=isolated
      - name: Compile ${{ matrix.name }}
        # The outfile is a subdirectory of the checkout — same filesystem as the
        # source (see docs/reference/tech-stack.md §1 / LORE-14): a cross-device
        # --outfile silently produces a 0-byte binary at exit 0.
        run: |
          mkdir -p "npm/${{ matrix.name }}/bin"
          bun build --compile --target=${{ matrix.target }} \
            --outfile="npm/${{ matrix.name }}/bin/${{ matrix.binary }}" src/cli.ts
      - name: Verify (execute natively where possible, else assert non-empty)
        shell: bash
        run: |
          bin="npm/${{ matrix.name }}/bin/${{ matrix.binary }}"
          size=$(stat -c%s "$bin")
          echo "compiled $bin: ${size} bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::binary suspiciously small (${size} bytes) — likely the EXDEV 0-byte trap"
            exit 1
          fi
          if [ "${{ matrix.name }}" = "linux-x64" ]; then
            chmod +x "$bin"
            version="$("$bin" --version)"
            echo "lore --version => '${version}'"
            if [ -z "$version" ]; then
              echo "::error::linux-x64 binary produced no --version output"
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lore-${{ matrix.name }}
          path: npm/${{ matrix.name }}/bin/
          if-no-files-found: error

  package:
    name: package + install-sanity (dry-run, never publishes)
    needs: [setup, build]
    runs-on: ubuntu-latest
    env:
      PLATFORM_NAMES_SPACE: ${{ needs.setup.outputs.namesSpace }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: npm-artifacts
      - name: Assemble each platform package's binary
        run: |
          for name in $PLATFORM_NAMES_SPACE; do
            mkdir -p "npm/$name/bin"
            cp -r "npm-artifacts/lore-$name/." "npm/$name/bin/"
            chmod +x npm/"$name"/bin/lore* 2>/dev/null || true
          done
      - name: npm pack every package (LORE-9 AC#1 — produces all platform artifacts; never publishes)
        # The root package's COMMITTED `bin` still points at src/cli.ts (see
        # docs/runbooks/release-publishing.md's release procedure — flipping it to
        # bin/lore.cjs is a first-release step, not a standing state, so pre-publish
        # git/link installs keep working). Patch a SCRATCH copy here (reverted via
        # `git checkout` immediately after) so this dry-run's install-sanity step
        # proves the launcher exactly as a real release will ship it. Filenames are
        # built from the exact version rather than a glob: `salient-data-lore-*.tgz`
        # also matches every platform package's tarball, and passing THOSE to `npm
        # install` explicitly (not resolved through optionalDependencies) makes npm
        # hard-fail EBADPLATFORM on any package.json os/cpu mismatch with the runner.
        run: |
          mkdir -p dist-npm
          version="$(node -p "require('./package.json').version")"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.bin.lore = "bin/lore.cjs";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npm pack --pack-destination "$PWD/dist-npm" .
          git checkout -- package.json
          for name in $PLATFORM_NAMES_SPACE; do
            (cd "npm/$name" && npm pack --pack-destination "$PWD/../../dist-npm" .)
          done
          ls -la dist-npm
          echo "ROOT_TARBALL=dist-npm/salient-data-lore-${version}.tgz" >> "$GITHUB_ENV"
          echo "LINUX_X64_TARBALL=dist-npm/salient-data-lore-linux-x64-${version}.tgz" >> "$GITHUB_ENV"
      - name: Install-sanity — npx-equivalent resolution through the real launcher (LORE-9 AC#2)
        run: |
          rm -rf /tmp/lore-install-sanity && mkdir -p /tmp/lore-install-sanity
          cd /tmp/lore-install-sanity
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$ROOT_TARBALL" "$GITHUB_WORKSPACE/$LINUX_X64_TARBALL"
          version="$(node node_modules/.bin/lore --version)"
          echo "lore --version (via bin/lore.cjs -> the linux-x64 optionalDependency) => '${version}'"
          if [ -z "$version" ]; then
            echo "::error::the launcher did not resolve/run the installed platform binary"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages-dry-run
          path: dist-npm/
          if-no-files-found: error

# TODO(LORE-9 follow-up, not this task): add a `publish` job gated on
# `inputs.publish == true` with `permissions: { id-token: write }`, using npm's
# OIDC-based trusted publishing. Requires configuring the npm trusted publisher for
# this repo + this workflow file once on npmjs.com first (a maintainer-only step —
# see docs/runbooks/release-publishing.md for the exact steps and commands). Also
# flip package.json's bin.lore to bin/lore.cjs for real as part of that same release
# (see docs/runbooks/release-publishing.md's release procedure) — the `package` job
# above only patches a scratch copy to dry-run-verify the launcher, never the
# committed file.
