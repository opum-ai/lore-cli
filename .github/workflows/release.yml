name: Release

# Manual-only trigger (workflow_dispatch) — never fires on a push or tag, so simply
# committing/tagging code can never kick off a release. `publish` defaults to false:
# a plain dispatch (or any dispatch that leaves `publish` at its default) only builds
# and packages every platform artifact and proves the npx/launcher mechanism resolves
# the right binary end-to-end (LCLI-9 AC#1/AC#2) — the `publish` job below simply does
# not run. Setting `publish: true` additionally runs that job, publishing every
# platform package and the root launcher to npm via OIDC Trusted Publishing (LCLI-255)
# — but only once a maintainer has completed the one-time npmjs.com Trusted Publisher
# setup for every package;
# see docs/runbooks/release-publishing.md's First-release checklist for the full
# mechanical sequence (version bump, the bin.lore flip, tag, dispatch).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish every platform package and the launcher to npm via OIDC Trusted Publishing (requires the one-time npmjs.com setup — see docs/runbooks/release-publishing.md). Leave false to only build/package/dry-run."
        type: boolean
        default: false
      ladybug_scale_observation:
        description: "Run the non-blocking 1 GiB Ladybug scale observation (30-minute time box)."
        type: boolean
        default: false
      acknowledge_dangling_provenance:
        # THE SANCTIONED WAY PAST A TRUE POSITIVE, and the reason nobody should ever need to
        # delete the provenance-pre job. That job re-checks ALREADY-PUBLISHED history, so once
        # a version's attestation starts pointing at a commit GitHub no longer has, it fails on
        # every subsequent dispatch and `publish` (which lists it in `needs:`) is unreachable.
        # Setting this to the task id tracking the loss waives the finding FOR THIS DISPATCH
        # ONLY: every dangling package is still listed, the reference is echoed into the log and
        # the job summary, and the next run fails again. The durable fix is to raise
        # KNOWN_DANGLING_THROUGH in scripts/release-provenance.mjs in a commit citing that task.
        # Deliberately a task id and not a checkbox — a waiver should name what it is
        # accountable to.
        description: "Only if provenance-pre failed: the task id tracking an accepted dangling-provenance loss (e.g. LCLI-481). Waives the finding for THIS dispatch, loudly, and does not persist. Leave empty."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  setup:
    name: resolve the release platform matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      names: ${{ steps.matrix.outputs.names }}
      namesSpace: ${{ steps.matrix.outputs.namesSpace }}
    steps:
      - id: matrix
        # The ONE place the supported platform triples are declared (ADR-0001 §"Build"; x64
        # targets are -baseline to avoid AVX2-only SIGILL on older/virtualized CPUs, arm64
        # is standard). `build`'s matrix, `verify-versions`, and `package`'s per-platform
        # loop all derive their platform list from this job's outputs instead of each
        # re-typing it — a platform added/removed here propagates everywhere automatically.
        # `namesSpace` is the same list pre-joined space-separated for `for name in ...`
        # shell loops, computed once here rather than re-decoded from `names` (JSON) in
        # every consuming step.
        run: |
          matrix='[{"name":"darwin-arm64","target":"bun-darwin-arm64","binary":"lore","runner":"macos-latest","os":"darwin","cpu":"arm64","ladybugPackage":"@ladybugdb/core-darwin-arm64","ladybugIntegrity":"sha512-3Ut3XL9kowzBoHw0wrN3QnW4xy5wYoPBypeuMtH92j59fol2w9e3lQJ6DM29YJ4F6mAVfW2cYGBXH2l9aXGmmw=="},{"name":"darwin-x64","target":"bun-darwin-x64-baseline","binary":"lore","runner":"macos-15-intel","os":"darwin","cpu":"x64","ladybugPackage":"@ladybugdb/core-darwin-x64","ladybugIntegrity":"sha512-KHuCBx+jkyxdfFEmmbsfUS1f108P4rS+VNkwCrMLvzJmJOZTZgNKeRmT0vO7qRum5KEoHSIPJLj2Le//rCYigQ=="},{"name":"linux-arm64","target":"bun-linux-arm64","binary":"lore","runner":"ubuntu-24.04-arm","os":"linux","cpu":"arm64","ladybugPackage":"@ladybugdb/core-linux-arm64","ladybugIntegrity":"sha512-z4Z67LZlgj6H7YnKMB1PornbdmeszVxfENusfDQ2MFyOyrze1X6c/3MkhVPyunuaTtriN9SBnEdyK39mB7NdyQ=="},{"name":"linux-x64","target":"bun-linux-x64-baseline","binary":"lore","runner":"ubuntu-24.04","os":"linux","cpu":"x64","ladybugPackage":"@ladybugdb/core-linux-x64","ladybugIntegrity":"sha512-aJOh7+XbTzCLNloK+KlDXuRmHgr7nLqyQwR/BR8fP/XsWVnxCKGpVVL8s+Lms7JNQAh6vEsvExttGgUq9hAu1Q=="},{"name":"win32-arm64","target":"bun-windows-arm64","binary":"lore.exe","runner":"windows-11-arm","os":"win32","cpu":"arm64","ladybugPackage":null,"ladybugIntegrity":null},{"name":"win32-x64","target":"bun-windows-x64-baseline","binary":"lore.exe","runner":"windows-latest","os":"win32","cpu":"x64","ladybugPackage":"@ladybugdb/core-win32-x64","ladybugIntegrity":"sha512-y2/IOMKmydo4ZfQPDZuZhiFC104VJQ9lwc0w1KVdvb4Z2RIUUL8/tn5QD4Uq8DUrJGxQhoEESPnlkk69cKaaDQ=="}]'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          names=$(node -e "console.log(JSON.stringify(JSON.parse(process.argv[1]).map((p) => p.name)))" "$matrix")
          echo "names=$names" >> "$GITHUB_OUTPUT"
          namesSpace=$(node -e "console.log(JSON.parse(process.argv[1]).map((p) => p.name).join(' '))" "$matrix")
          echo "namesSpace=$namesSpace" >> "$GITHUB_OUTPUT"

  verify-versions:
    name: assert release package versions + metadata are consistent
    needs: setup
    runs-on: ubuntu-latest
    env:
      PLATFORM_MATRIX: ${{ needs.setup.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Assert version, license, author, repository, os/cpu, binary filename, and the optionalDependencies pin all match
        # bin/lore.cjs resolves a platform optionalDependency purely by name; npm silently
        # SKIPS it if the installed version doesn't satisfy root's pinned range — for an
        # exact pin, "doesn't exactly match." A missed version bump on any of: the root
        # `version`, a platform package's `version`, or root's `optionalDependencies` pin
        # for that package, would surface as "no compiled binary found" for a fully
        # supported platform, indistinguishable from a genuinely unsupported one. license/
        # author/repository drift is lower-stakes (cosmetic/registry-page metadata) but
        # checked here too since it is duplicated the same way. os/cpu drift is higher-stakes
        # again: it is what gates npm's optionalDependencies install decision, so a wrong
        # value either silently skip-installs a platform package on its own matching host or
        # wrongly installs it elsewhere. Fail loud, before any compile work, naming every
        # mismatch found (not just the first).
        run: |
          # The ${...} below are JS template literals for `node -e`, not shell
          # interpolation — single-quoting is intentional.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const matrix = JSON.parse(process.env.PLATFORM_MATRIX);
            const platforms = matrix.map((p) => p.name);
            const fields = ["version", "license", "author"];
            const problems = [];

            // Field-by-field, not JSON.stringify — stringify-equality is fragile to key
            // order (two semantically-identical {type,url} objects with keys typed in a
            // different order would otherwise false-positive as a mismatch).
            function sameShallowObject(a, b) {
              const av = a || {};
              const bv = b || {};
              const keys = new Set([...Object.keys(av), ...Object.keys(bv)]);
              for (const key of keys) {
                if (av[key] !== bv[key]) return false;
              }
              return true;
            }

            function sameStringArray(actual, expected) {
              return (
                Array.isArray(actual) &&
                actual.length === expected.length &&
                expected.every((value, i) => actual[i] === value)
              );
            }

            // The platform name is the single source of truth for its npm os/cpu gate and
            // its compiled binary filename: the segment before/after the first "-" (e.g.
            // "darwin-arm64" -> os "darwin", cpu "arm64"; "win32-x64" -> os "win32", cpu
            // "x64") already uses the npm-style os token ("win32", not "windows"), matching
            // what npm/<name>/package.json declares.
            function expectedOsCpu(name) {
              const dash = name.indexOf("-");
              return { os: name.slice(0, dash), cpu: name.slice(dash + 1) };
            }

            // Cross-check the platform SET itself, not just per-platform fields: the setup
            // job matrix literal and the optionalDependencies keys are two independently
            // maintained declarations of "which platforms ship" — nothing else catches them
            // drifting apart (e.g. a 6th platform added to one but not the other).
            const optionalDepNames = Object.keys(root.optionalDependencies || {}).sort();
            const declaredPkgNames = platforms.map((name) => `@opum-ai/lore-${name}`).sort();
            if (JSON.stringify(optionalDepNames) !== JSON.stringify(declaredPkgNames)) {
              problems.push(
                `platform set mismatch: setup job declares [${declaredPkgNames.join(", ")}], but root package.json optionalDependencies has [${optionalDepNames.join(", ")}]`,
              );
            }

            for (const { name, binary } of matrix) {
              const pkg = JSON.parse(fs.readFileSync(`npm/${name}/package.json`, "utf8"));
              for (const field of fields) {
                if (pkg[field] !== root[field]) {
                  problems.push(`npm/${name}/package.json: ${field} is "${pkg[field]}", root is "${root[field]}"`);
                }
              }
              if (!sameShallowObject(pkg.repository, root.repository)) {
                problems.push(`npm/${name}/package.json: repository does not match root`);
              }
              const pin = root.optionalDependencies && root.optionalDependencies[pkg.name];
              if (pin !== pkg.version) {
                problems.push(`root package.json optionalDependencies["${pkg.name}"] is "${pin}", but npm/${name}/package.json version is "${pkg.version}"`);
              }

              const { os: expectedOs, cpu: expectedCpu } = expectedOsCpu(name);
              if (!sameStringArray(pkg.os, [expectedOs])) {
                problems.push(`npm/${name}/package.json: os is ${JSON.stringify(pkg.os)}, expected ["${expectedOs}"] (derived from platform name "${name}")`);
              }
              if (!sameStringArray(pkg.cpu, [expectedCpu])) {
                problems.push(`npm/${name}/package.json: cpu is ${JSON.stringify(pkg.cpu)}, expected ["${expectedCpu}"] (derived from platform name "${name}")`);
              }

              // The setup job per-entry `binary` is what the build job --outfile AND
              // bin/lore.cjs own hardcoded BINARY_NAME must agree on ("lore.exe" only for
              // win32, "lore" everywhere else) — assert it here, before any compile work,
              // rather than only implicitly via the build job writing to whatever path it
              // was given.
              const expectedBinary = expectedOs === "win32" ? "lore.exe" : "lore";
              if (binary !== expectedBinary) {
                problems.push(`setup job matrix entry "${name}": binary is "${binary}", expected "${expectedBinary}" for os "${expectedOs}"`);
              }
            }
            if (problems.length > 0) {
              for (const p of problems) console.error(`::error::${p}`);
              process.exit(1);
            }
            console.log(`the launcher and all ${platforms.length} platform packages are consistent (version ${root.version})`);
          '

  ladybug-qualification:
    name: Ladybug bounded 100 MiB qualification (ubuntu-24.04 x64)
    needs: verify-versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A second dispatch queues instead of overlapping the bounded timing gate.
    concurrency:
      group: ladybug-release-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-bun
      - name: Assert the qualification host and toolchain
        shell: bash
        run: |
          actual_bun="$(bun --version)"
          if [ "$actual_bun" != "1.3.14" ]; then
            echo "::error::Ladybug qualification requires Bun 1.3.14, observed $actual_bun"
            exit 1
          fi
          if [ "$(uname -s)" != "Linux" ] || [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::Ladybug release qualification requires Linux x64"
            exit 1
          fi
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            echo "::error::GitHub runner image identity is unavailable"
            exit 1
          fi
      - name: Run the bounded paired Ladybug qualification
        shell: bash
        run: |
          mkdir -p artifacts
          bun benchmark/ladybug/run.ts \
            --fixture large \
            --output artifacts/ladybug-benchmark-v1.json \
            --runner-image "${ImageOS}-${ImageVersion}"
      - name: Assert conclusive threshold success
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          # The ${...} below is a JavaScript template literal inside the single-quoted
          # bun program, not shell interpolation.
          # shellcheck disable=SC2016
          bun -e '
            const report = await Bun.file("artifacts/ladybug-benchmark-v1.json").json();
            const fixtures = report.fixtures?.map((fixture) => fixture.name);
            if (
              report.schema !== "lore.ladybug-benchmark/1" ||
              report.mode !== "qualification" ||
              report.host?.platform !== "linux" ||
              report.host?.arch !== "x64" ||
              report.repository?.commit !== process.env.EXPECTED_COMMIT ||
              report.repository?.dirty !== false ||
              JSON.stringify(fixtures) !== JSON.stringify(["large"]) ||
              report.gates?.evaluation?.status !== "pass"
            ) {
              console.error("::error::Ladybug qualification artifact is not a conclusive Linux-x64 pass");
              process.exit(1);
            }
            console.log(`Ladybug qualification passed ${report.gates.results.length} approved gates`);
          '
      # ARTIFACT NAMES CARRY run_id BUT NOT run_attempt, AND THAT IS DELIBERATE -- read this
      # before "fixing" a duplicate-name failure by putting the attempt back (LCLI-487).
      #
      # They DID carry `-${{ github.run_attempt }}` until 2026-09-14, for a real reason:
      # artifacts are scoped to the RUN, not the attempt, so on a PARTIAL re-run
      # (`gh run rerun --failed`) a re-running job's upload collides with the copy that
      # survived from the earlier attempt, and upload-artifact v4 FAILS on a duplicate name.
      # The suffix bought collision-freedom and paid for it with something worse: jobs that
      # SUCCEEDED on attempt 1 keep their `-1` names while the consumer on attempt 2 looks
      # only for `-2`, so the evidence job could never resolve them and `--failed` was
      # structurally unusable on this workflow. Measured on run 34801853367.
      #
      # `overwrite: true` solves the collision without the suffix: a re-running job replaces
      # its OWN artifact, while a job that did not re-run keeps its artifact under the same
      # stable name the consumer looks for. Its documented behaviour includes "does not fail
      # if the artifact does not exist", so it is safe on a first attempt too, and the input
      # exists at the pinned sha ea165f8d (v4.6.2) -- checked at that exact ref, not on the
      # action's default branch.
      #
      # PROVEN, not reasoned about: a probe workflow with one always-green producer, one
      # producer failing on attempt 1, and a consumer needing both was run and then re-run
      # with `--failed`. On attempt 2 the consumer read "produced on attempt 1" from the
      # non-re-run job and "produced on attempt 2" from the re-run one, with no duplicate
      # artifacts left behind.
      #
      # Mixing attempts within a run is safe because every artifact in a run comes from the
      # same head_sha, and the `package` job below independently asserts
      # `report.repository.commit == GITHUB_SHA` for each platform report.
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ladybug-benchmark-qualification-linux-x64-${{ github.run_id }}
          path: |
            artifacts/ladybug-benchmark-v1.json
            benchmark/ladybug/gates/v1.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

  ladybug-scale-observation:
    name: Ladybug optional 1 GiB observation (ubuntu-24.04 x64)
    if: inputs.ladybug_scale_observation == true
    continue-on-error: true
    needs: verify-versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-bun
      - name: Run the informational 1 GiB observation
        shell: bash
        run: |
          mkdir -p artifacts
          bun benchmark/ladybug/run.ts \
            --fixture large \
            --observation-1gib \
            --output artifacts/ladybug-benchmark-observation-1gib-v1.json \
            --runner-image "${ImageOS}-${ImageVersion}"
      - name: Upload informational observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ladybug-benchmark-observation-1gib-${{ github.run_id }}
          path: artifacts/ladybug-benchmark-observation-1gib-v1.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  ladybug-concurrency-qualification:
    name: Ladybug concurrency and crash qualification (ubuntu-24.04 x64)
    needs: verify-versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-bun
      - name: Run focused multi-process contention, crash, lifecycle, and indexed retrieval tests
        shell: bash
        env:
          LADYBUG_CONCURRENCY_EVIDENCE: artifacts/ladybug-concurrency-evidence-v1.json
        run: |
          mkdir -p artifacts
          bun test --isolate \
            test/ladybug-concurrency.test.ts \
            test/ladybug-lifecycle.test.ts \
            test/indexed-retrieval.test.ts
      - name: Assert complete sanitized concurrency evidence
        shell: bash
        env:
          REPORT_PATH: artifacts/ladybug-concurrency-evidence-v1.json
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          bun -e '
            import {
              LADYBUG_CONCURRENCY_EVIDENCE_KILL_POINTS,
              parseLadybugConcurrencyEvidenceReport,
            } from "./benchmark/ladybug/concurrency-evidence";
            const path = process.env.REPORT_PATH;
            if (!path) throw new Error("concurrency evidence report path is unavailable");
            const report = parseLadybugConcurrencyEvidenceReport(await Bun.file(path).json());
            if (
              report.toolchain.bun !== "1.3.14" ||
              report.repository.commit !== process.env.EXPECTED_COMMIT ||
              report.repository.dirty ||
              report.status !== "pass" ||
              JSON.stringify(report.coverage.killPoints) !== JSON.stringify(LADYBUG_CONCURRENCY_EVIDENCE_KILL_POINTS)
            ) {
              throw new Error("concurrency artifact is not clean pinned-Bun executable evidence");
            }
          '
      - name: Upload concurrency and crash evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ladybug-concurrency-qualification-${{ github.run_id }}
          path: artifacts/ladybug-concurrency-evidence-v1.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

      # ############################################################################
      # TEMPORARY FAULT — LCLI-487 AC#2 ONLY. MUST BE DELETED BEFORE THIS LANDS.
      # Stands in for the genuine concurrency flake so that a partial re-run can be
      # exercised against the REAL job graph rather than a probe workflow. Fails the
      # first attempt only, AFTER the upload above, so attempt 1 leaves a real
      # artifact behind exactly as the flake did on run 34801853367.
      - name: TEMPORARY LCLI-487 fault (delete me)
        run: |
          if [ "${{ github.run_attempt }}" = "1" ]; then
            echo "::error::TEMPORARY LCLI-487 fault: failing attempt 1 on purpose"
            exit 1
          fi
          echo "attempt ${{ github.run_attempt }}: temporary fault passing through"
      # ############################################################################

  package-qualification:
    name: "matching-host package qualification (${{ matrix.name }})"
    needs: [setup, verify-versions, ladybug-qualification, ladybug-concurrency-qualification]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The shared action is the isolated frozen install. Its Bun pin and
      # --linker=isolated flags are part of the package-qualification contract.
      # Ladybug publishes no Windows ARM64 addon, so that one host installs the
      # frozen dependency graph without running its unsupported source-build script.
      - uses: ./.github/actions/setup-bun
        with:
          ignore-scripts: ${{ matrix.name == 'win32-arm64' }}
      - name: Build, pack, install, smoke, uninstall, and audit ${{ matrix.name }}
        shell: bash
        run: |
          bun benchmark/ladybug/package-qualification.ts \
            --name "${{ matrix.name }}" \
            --target "${{ matrix.target }}" \
            --binary "${{ matrix.binary }}" \
            --os "${{ matrix.os }}" \
            --cpu "${{ matrix.cpu }}" \
            --ladybug-package "${{ matrix.ladybugPackage }}" \
            --ladybug-integrity "${{ matrix.ladybugIntegrity }}" \
            --output "artifacts/ladybug-package-qualification-${{ matrix.name }}.json"
      - name: Assert the approved native platform verdict
        shell: bash
        env:
          REPORT_PATH: artifacts/ladybug-package-qualification-${{ matrix.name }}.json
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_CPU: ${{ matrix.cpu }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          bun -e '
            import { assertPackageQualificationReport } from "./benchmark/ladybug/package-qualification";
            const path = process.env.REPORT_PATH;
            if (!path) throw new Error("package qualification report path is unavailable");
            const report = await Bun.file(path).json();
            assertPackageQualificationReport(report);
            if (
              report.mode !== "qualification" ||
              report.platform.os !== process.env.EXPECTED_OS ||
              report.platform.cpu !== process.env.EXPECTED_CPU ||
              report.repository.commit !== process.env.EXPECTED_COMMIT
            ) {
              throw new Error("package qualification artifact does not match its matrix host");
            }
            if (
              process.env.EXPECTED_OS === "win32"
                ? report.native.supportClaim !== "reference-fallback-only" ||
                  report.native.referenceFallbackDatabaseAbsent !== true ||
                  report.native.databaseCreated
                : report.native.supportClaim !== "native-index" ||
                  report.native.probeOutcome !== "pass" ||
                  !report.native.executableEvidence ||
                  !report.native.databaseCreated
            ) {
              throw new Error("package qualification artifact violates the approved native support policy");
            }
          '
      - name: Upload matching-host package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ladybug-package-qualification-${{ matrix.name }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

  ladybug-qualification-evidence:
    name: Assemble Ladybug acceptance evidence
    needs: [ladybug-qualification, ladybug-concurrency-qualification, package-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-bun
      - name: Download bounded benchmark evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ladybug-benchmark-qualification-linux-x64-${{ github.run_id }}
          path: qualification-inputs/benchmark
      - name: Download concurrency evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ladybug-concurrency-qualification-${{ github.run_id }}
          path: qualification-inputs/concurrency
      - name: Download all matching-host package evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ladybug-package-qualification-*-${{ github.run_id }}
          path: qualification-inputs/packages
          merge-multiple: true
      - name: Build the strict task-level evidence manifest
        shell: bash
        run: |
          benchmark_report="$(find qualification-inputs/benchmark -type f -name 'ladybug-benchmark-v1.json' -print -quit)"
          gate_policy="$(find qualification-inputs/benchmark -type f -name 'v1.json' -print -quit)"
          concurrency_report="$(find qualification-inputs/concurrency -type f -name 'ladybug-concurrency-evidence-v1.json' -print -quit)"
          if [ -z "$benchmark_report" ] || [ -z "$gate_policy" ] || [ -z "$concurrency_report" ]; then
            echo "::error::required Ladybug qualification input is missing"
            exit 1
          fi
          package_reports=()
          while IFS= read -r report; do
            package_reports+=(--package-report "$report")
          done < <(find qualification-inputs/packages -type f -name 'ladybug-package-qualification-*.json' -print | sort)
          bun benchmark/ladybug/qualification-evidence.ts \
            --linux-benchmark "$benchmark_report" \
            --gates "$gate_policy" \
            --concurrency "$concurrency_report" \
            "${package_reports[@]}" \
            --output artifacts/ladybug-qualification-evidence-v1.json
      - name: Assert the final manifest maps all acceptance criteria to this commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          bun -e '
            import { parseLadybugQualificationEvidenceManifest } from "./benchmark/ladybug/qualification-evidence";
            const manifest = parseLadybugQualificationEvidenceManifest(
              await Bun.file("artifacts/ladybug-qualification-evidence-v1.json").json(),
            );
            if (
              manifest.repository.commit !== process.env.EXPECTED_COMMIT ||
              manifest.status !== "pass" ||
              manifest.acceptanceCriteria.map(({ number }) => number).join(",") !== "1,2,3,4"
            ) {
              throw new Error("Ladybug qualification manifest does not map a clean passing evidence set");
            }
          '
      - name: Upload final Ladybug qualification manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ladybug-qualification-evidence-${{ github.run_id }}
          path: artifacts/ladybug-qualification-evidence-v1.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  package:
    name: package + install-sanity (dry-run, never publishes)
    needs: [setup, package-qualification, ladybug-qualification-evidence]
    runs-on: ubuntu-latest
    env:
      PLATFORM_NAMES_SPACE: ${{ needs.setup.outputs.namesSpace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ladybug-package-qualification-*-${{ github.run_id }}
          path: qualified-packages
      - name: Assemble the exact matching-host-qualified platform tarballs
        run: |
          mkdir -p dist-npm
          version="$(node -p "require('./package.json').version")"
          for name in $PLATFORM_NAMES_SPACE; do
            artifact_dir="qualified-packages/ladybug-package-qualification-${name}-${{ github.run_id }}"
            report="${artifact_dir}/ladybug-package-qualification-${name}.json"
            tarball="${artifact_dir}/opum-ai-lore-${name}-${version}.tgz"
            # shellcheck disable=SC2016
            REPORT_PATH="$report" TARBALL_PATH="$tarball" EXPECTED_NAME="$name" EXPECTED_COMMIT="$GITHUB_SHA" node -e '
              const { createHash } = require("node:crypto");
              const { readFileSync } = require("node:fs");
              const report = JSON.parse(readFileSync(process.env.REPORT_PATH, "utf8"));
              const digest = `sha256:${createHash("sha256").update(readFileSync(process.env.TARBALL_PATH)).digest("hex")}`;
              if (
                report.schema !== "lore.ladybug-package-qualification/3" ||
                report.mode !== "qualification" ||
                report.platform?.distribution !== process.env.EXPECTED_NAME ||
                report.repository?.commit !== process.env.EXPECTED_COMMIT ||
                report.package?.platform !== `@opum-ai/lore-${process.env.EXPECTED_NAME}` ||
                report.package?.platformTarballSha256 !== digest
              ) {
                throw new Error(`qualified platform tarball identity check failed for ${process.env.EXPECTED_NAME}`);
              }
            '
            cp "$tarball" dist-npm/
          done
      - name: npm pack every package (LCLI-9 AC#1 — produces all platform artifacts; never publishes)
        # Platform tarballs above are byte-for-byte the artifacts that already ran
        # the matching-host forced-indexed package qualification. Pack only the root
        # launcher here so publication cannot substitute an unqualified binary.
        run: |
          version="$(node -p "require('./package.json').version")"
          npm pack --pack-destination "$PWD/dist-npm" .
          ls -la dist-npm
          echo "ROOT_TARBALL=dist-npm/opum-ai-lore-${version}.tgz" >> "$GITHUB_ENV"
          echo "LINUX_X64_TARBALL=dist-npm/opum-ai-lore-linux-x64-${version}.tgz" >> "$GITHUB_ENV"
      - name: Install-sanity — npx-equivalent resolution through the real launcher (LCLI-9 AC#2)
        run: |
          # Same comparison mechanism as ci.yml's compile-smoke job (ci.yml:56-64):
          # read package.json's version, compare strictly, hard-fail naming both
          # values on mismatch. This job has no bun toolchain (no setup-bun step),
          # so `node -p` reads package.json here — matching the `node -p` already
          # used earlier in this same job — rather than the `bun -e` the build job
          # uses (which does have bun via setup-bun).
          expected="$(node -p "require('./package.json').version")"
          rm -rf /tmp/lore-install-sanity && mkdir -p /tmp/lore-install-sanity
          cd /tmp/lore-install-sanity
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$ROOT_TARBALL" "$GITHUB_WORKSPACE/$LINUX_X64_TARBALL"
          node -e '
            const manifest = require("./node_modules/@opum-ai/lore/package.json");
            if (manifest.dependencies && Object.keys(manifest.dependencies).length > 0) {
              throw new Error("published launcher unexpectedly contains runtime dependencies");
            }
            try {
              require.resolve("@ladybugdb/core/package.json");
              throw new Error("published launcher unexpectedly installed @ladybugdb/core");
            } catch (error) {
              if (error.code !== "MODULE_NOT_FOUND") throw error;
            }
          '
          version="$(node node_modules/.bin/lore --version)"
          echo "lore --version (via bin/lore.cjs -> the linux-x64 optionalDependency) => '${version}' (package.json: '${expected}')"
          if [ -z "$version" ]; then
            echo "::error::the launcher did not resolve/run the installed platform binary"
            exit 1
          fi
          if [ "${version}" != "${expected}" ]; then
            echo "::error::version mismatch: binary='${version}' package.json='${expected}'"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: dist-npm/
          if-no-files-found: error
          overwrite: true

  provenance-pre:
    name: re-verify published provenance still resolves (LCLI-481)
    runs-on: ubuntu-latest
    # NO `needs:` and NO `if:` — this runs on every dispatch, dry-run included. It reads the
    # public registry and the public GitHub API and touches nothing, so there is no reason to
    # reserve the signal for real publishes, and a dry-run dispatch is exactly when a
    # maintainer wants to find out that a history rewrite broke the last release's provenance.
    #
    # THIS JOB MUST NOT CARRY `continue-on-error:` EITHER. GitHub runs the dependents of a job
    # that failed under continue-on-error, so adding it here would leave every wiring assertion
    # green while `publish` proceeds past a red gate — the single cheapest way to neuter this
    # without anyone noticing. test/release-workflow.test.ts asserts its absence, along with
    # the absence of an `if:` and of any `|| true` in the step below.
    permissions:
      contents: read
    # Bounded because this job gates `publish`: a hung connection must not hold a runner for
    # the 6-hour default while the release waits on it. Every request inside the script has its
    # own 20s ceiling too (LORE_PROVENANCE_TIMEOUT_MS), so reaching this limit means something
    # is wrong with the job, not with one endpoint.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # DELIBERATELY no `registry-url:` — that input makes setup-node write
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into the job's .npmrc. This
          # job only ever GETs public JSON; giving it a credential line would be handing a
          # publishing-shaped credential to a job that has no business publishing.
      - name: Re-verify the provenance already on the registry (--pre)
        # WHAT THIS CATCHES: a history rewrite between two releases. Every @opum-ai/lore*
        # version published from CI before 0.6.1 pins a commit destroyed when this repo was
        # deleted and recreated on 2026-09-10 (LCLI-481) — 0.6.0 pins
        # 59ba30e497f8e98aa6c6be022d9363fd718fb4ee, which api.github.com answers 422 for. Those
        # links cannot be repaired: the attestation is signed and the version cannot be
        # republished. So the script treats everything at or below its KNOWN_DANGLING_THROUGH
        # baseline as accepted damage — listed on every run, never failed on — and fails only
        # when a version published AFTER the baseline stops resolving, which is the signature of
        # a NEW rewrite. Blocking here is the point: it stops this release from adding another
        # permanently-dangling version to the pile before anyone has looked at the rewrite.
        #
        # It never calls git. The destroyed commits are still present as loose objects in a
        # clone made before the rewrite, so a local `git cat-file -t` prints `commit` and exits
        # 0 on exactly the artifacts this gate exists to catch (verified 2026-09-13).
        #
        # IF THIS FAILS, READ THE ERROR BEFORE CHANGING ANYTHING. A true positive does not clear
        # by itself — it re-fails every run and blocks `publish` — so the script prints the two
        # sanctioned ways forward, and the `acknowledge_dangling_provenance` input below is the
        # one that unblocks a release TODAY without pretending the finding went away.
        env:
          # 60 requests/hour unauthenticated is not enough headroom for a release run, and an
          # exhausted rate limit degrades to "inconclusive" (a loud pass), which would quietly
          # turn the gate off. contents: read is all the commits endpoint needs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACKNOWLEDGE: ${{ inputs.acknowledge_dangling_provenance }}
        # Two literal invocations rather than an interpolated argument string: an unquoted
        # "$args" expansion would word-split, and a quoted one would pass an empty argument.
        # Neither branch may grow a `|| true` — that is an assertion in the wiring test.
        run: |
          if [ -n "$ACKNOWLEDGE" ]; then
            node scripts/release-provenance.mjs --pre --acknowledge "$ACKNOWLEDGE"
          else
            node scripts/release-provenance.mjs --pre
          fi

  publish:
    name: publish (npm, OIDC trusted publishing)
    # Only runs on an explicit `publish: true` dispatch (the input defaults to
    # false) — this workflow is itself workflow_dispatch-only (never fires on a
    # push or tag), so a real publish always requires a maintainer to
    # deliberately opt in on that one run, never as a side effect of any other
    # trigger.
    if: ${{ inputs.publish == true }}
    # provenance-pre gates this job: a rewrite that dangled an already-published version's
    # attestation must stop the release rather than be added to (LCLI-481).
    needs: [setup, package, provenance-pre]
    runs-on: ubuntu-latest
    # LCLI-268: an OUT-OF-FILE gate, on top of (not instead of) the `if:` guard above.
    # npm Trusted Publishing (LCLI-255) matches OIDC tokens on repo + WORKFLOW FILENAME,
    # not a ref, and this workflow is workflow_dispatch-reachable on any branch — so an
    # actor with write access could push a branch carrying a release.yml with every
    # in-file guard stripped (the `if:` above, the 0.0.0 refusal, the npm-version floor)
    # and dispatch it there. An in-workflow `if: github.ref == …` guard would NOT close
    # that: it lives in the exact file the attacker already controls, so it is trivially
    # deleted along with everything else. `environment: release` instead ties this job to
    # GitHub Environment protection rules (required reviewers / allowed deployment
    # branches), which are repo Settings configuration evaluated by GitHub's deployment
    # subsystem, not workflow content — they still apply to a run using a wholesale-
    # replaced copy of this file. This line is INERT on its own: referencing an
    # environment that has no protection rules configured auto-creates it with none, and
    # an attacker who deletes this line from their forged copy skips the gate entirely
    # unless every package's npm Trusted Publisher config also requires this
    # environment's OIDC claim. Both of those are repo-admin actions this workflow change
    # does not and cannot perform — see docs/runbooks/release-publishing.md's "Repo-admin
    # setup for the release Environment (LCLI-268)" section for the exact steps and the
    # residual risk until they're done.
    environment: release
    # Job-scoped (not workflow-scoped): only serializes overlapping runs of THIS job —
    # two `publish: true` dispatches queued back-to-back run one after the other rather
    # than interleaving their `npm publish` calls, which the resumable skip-check
    # (below) tolerates but does not need to race against. Dry-run-only dispatches
    # (the common case) never touch this job, so they are unaffected and can still run
    # concurrently. `cancel-in-progress: false` because canceling a real publish
    # mid-flight is worse than queuing behind it.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    # id-token: write is scoped to ONLY this job — the workflow-level
    # `permissions:` block above stays `contents: read`, so no other job in
    # this workflow (including this one's own upstream dependencies) can mint
    # an OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-packages
          path: dist-npm
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm to meet the OIDC trusted-publishing floor
        # Trusted publishing needs npm >= 11.5.1. `node-version: 24` above resolves to
        # whatever the latest 24.x ships, which is not guaranteed to bundle a new-enough
        # npm — upgrade here so the floor is actually MET, not merely checked below. Cheap
        # (npm is already on PATH from setup-node) and keeps this job self-sufficient
        # rather than depending on a future Node release to happen to bundle the floor.
        # Pinned to the `^11` major (not `@latest`): this is the only job with
        # `id-token: write`, so an unpinned global install of npm's own CLI would let a
        # compromised npm release run with publish capability the moment it ships —
        # `^11` keeps the auto-upgrade intent (still tracks patch/minor fixes, still
        # satisfies the floor assertion below) while narrowing that window to versions
        # that predate any such compromise landing on a new major.
        run: npm install -g npm@^11
      - name: Assert no token is shadowing OIDC (quest-cli QCLI finding, 2026-08-30)
        # THE FAILURE THIS PREVENTS IS SILENT AND COSTS HOURS. `actions/setup-node` with
        # `registry-url` writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into the
        # job's .npmrc.
        #
        # WHAT A CONFIGURED TOKEN ACTUALLY DOES, read out of npm's own source (lib/utils/oidc.js
        # and lib/commands/publish.js, verified identical in npm 11.19.1 and 12.0.2 -- 11.x is
        # what the step above installs). An earlier revision of this comment said a real token
        # makes npm "NEVER ATTEMPT OIDC". That is FALSE and it sent a sibling repo down a
        # six-dispatch blind alley, so the mechanism is spelled out here rather than summarised:
        #
        #   - publish.js calls `await oidc({...})` UNCONDITIONALLY, and does it BEFORE reading
        #     credentials at all (`getCredentialsByURI` runs on the NEXT line).
        #   - oidc.js has NO early return on an existing `_authToken`. It bails only on: not a
        #     recognised CI vendor, ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN absent, no id_token, the
        #     exchange request threw, or the exchange response carried no `.token`.
        #   - On success it OVERWRITES whatever .npmrc held:
        #         opts[authTokenKey] = response.token
        #         config.set(authTokenKey, response.token, 'user')
        #
        # So a configured token does not BLOCK OIDC -- it becomes the silent FALLBACK for when
        # the exchange fails, because oidc.js swallows that failure (log.verbose, return
        # undefined) and npm carries on with .npmrc. That is why the check below still earns its
        # place, and it is a WORSE hazard than the one the old comment described: a dead or
        # wrongly-scoped token turns a failed exchange into an E404 on PUT that looks exactly
        # like a missing trust relationship, and a LIVE one lets the publish SUCCEED under the
        # wrong identity with no provenance and no diagnostic at all.
        #
        # setup-node's own placeholder (`XXXXX-XXXXX-XXXXX-XXXXX`, exported unconditionally when
        # `registry-url` is set and no token is configured) is accepted below for the same
        # reason: it cannot prevent the exchange either. v0.6.0 published successfully from CI,
        # with provenance, with that placeholder present -- `git show v0.6.0:.github/workflows/
        # release.yml` has a byte-identical setup-node step. Do not "fix" the placeholder and
        # expect a broken publish to start working; see LCLI-482.
        #
        # Adding an NPM_TOKEN secret later would silently switch this job's auth mode with no
        # diagnostic. Assert it instead.
        #
        # npm gives E404 on PUT for at least four distinct causes -- token cannot write, token
        # invalid, npm too old so OIDC was skipped, and no trust relationship -- and no way to
        # tell them apart. Every cause we CAN rule out before touching the registry is one that
        # cannot masquerade as another later.
        run: |
          token="$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null | tr -d '[:space:]')"
          case "$token" in
            ""|undefined|null|XXXXX-XXXXX-XXXXX-XXXXX)
              echo "no real registry token configured — OIDC will be used" ;;
            *)
              echo "::error::a registry auth token is configured for this job. npm still ATTEMPTS OIDC first, but this token becomes the silent fallback if the exchange fails -- publishing under the wrong identity without provenance, or returning an E404 that looks like a missing trust relationship. Remove the NPM_TOKEN secret / node-auth-token input from the publish job; trusted publishing needs no stored credential."
              exit 1 ;;
          esac
      - name: Assert npm CLI meets the OIDC trusted-publishing floor (docs/runbooks/release-publishing.md Prerequisites)
        # Post-condition check for the upgrade step above — fail loud here, before
        # touching the registry, rather than letting an unmet floor surface as a
        # confusing mid-publish auth error. A non-numeric prerelease segment (e.g.
        # "11.5.1-pre.0") makes `Number(...)` yield NaN, and every NaN comparison below
        # is false, so `meetsFloor` is false — this deliberately fails CLOSED (reported
        # as "older than the floor") rather than risking a false pass.
        run: |
          # The ${...} below are JS template literals for `node -e`, not shell
          # interpolation — single-quoting is intentional.
          # shellcheck disable=SC2016
          node -e '
            const { execSync } = require("node:child_process");
            const version = execSync("npm --version").toString().trim();
            const [major, minor, patch] = version.split(".").map(Number);
            const meetsFloor = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!meetsFloor) {
              console.error(`::error::npm ${version} is older than the >= 11.5.1 floor OIDC trusted publishing requires`);
              process.exit(1);
            }
            console.log(`npm ${version} meets the >= 11.5.1 trusted-publishing floor`);
          '
      - name: Publish platform binaries first, launcher LAST (resumable) via OIDC trusted publishing
        # ORDER IS LOAD-BEARING: the root launcher's optionalDependencies pin the
        # platform packages at an EXACT version, and bin/lore.cjs require.resolve()s them
        # at runtime. Publishing root first would (a) leave a window where
        # `npx @opum-ai/lore` installs a launcher whose platform deps 404 (npm skips
        # an unresolvable optional dep, so the install "succeeds" and only fails at run
        # time with "no compiled binary found"), and (b) on any mid-loop failure leave the
        # root published at a version that can never be republished — with the first
        # publish having already set the `latest` dist-tag. Root last means a partial
        # failure leaves nothing users can install, so the same version can be retried
        # after fixing the cause (see docs/runbooks/release-publishing.md Rollback).
        #
        # RESUMABLE: `run:` blocks execute under `bash -e`, so the first failing `npm
        # publish` aborts the loop. Re-dispatching would otherwise 403 (EPUBLISHCONFLICT)
        # on the packages already published. `publish_or_skip` checks the registry first
        # and skips anything already there, so re-dispatching after a partial failure
        # completes the rest instead of being permanently stuck.
        #
        # This job has no checkout (only the packed tarballs), so the platform set comes
        # from `needs.setup.outputs.namesSpace` (the same single source of truth every
        # other job derives its platform list from) rather than re-deriving it from
        # package.json here. The root/launcher tarball is whatever tarball's name does
        # NOT match any `-<platform>-` segment — asserted to be exactly one, so a
        # naming/count drift fails loud instead of silently publishing the wrong thing
        # last (or not at all).
        env:
          PLATFORM_NAMES_SPACE: ${{ needs.setup.outputs.namesSpace }}
          # npm logs the ONE line that says why trusted publishing was refused at verbose only:
          #   log.verbose('oidc', `Failed token exchange request with body message: ${...}`)
          # At the default loglevel that failure is swallowed (oidc.js returns undefined) and the
          # run surfaces it four layers downstream as a generic E404 on PUT, which has at least
          # four indistinguishable causes. Every OIDC diagnosis on LCLI-482 so far -- ours and a
          # sibling repo's, one of which was wrong -- is an INFERENCE from that E404, because
          # nobody had the registry's own words. This costs one env var and turns the next failed
          # dispatch into an answer instead of another theory.
          #
          # Checked before enabling, because this repo is public and so are these logs: npm's
          # `redactLog` is applied to argv, error messages and audit URIs -- NOT to every
          # verbose line -- so verbose is not blanket-safe by construction. It is safe HERE
          # because oidc.js never logs the exchanged token (only "Successfully retrieved and
          # set token"), registry auth travels as a header rather than in the logged URL, and
          # the redact matchers catch an `npm_`-prefixed token anywhere they do apply. If a
          # future npm starts logging credentials at verbose, this env var is the thing to pull.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          publish_or_skip() {
            local tgz="$1"
            local name version
            # Here-string (not a heredoc): the RHS is a command substitution whose
            # output ("name version", space-separated) `read` splits into the two
            # variables below.
            read -r name version <<< "$(tar -xzOf "$tgz" package/package.json | node -e '
              let data = "";
              process.stdin.on("data", (chunk) => { data += chunk; });
              process.stdin.on("end", () => {
                const pkg = JSON.parse(data);
                console.log(pkg.name, pkg.version);
              });
            ')"
            # `read ... <<< "$(cmd)"` fails OPEN if `cmd` errors: a here-string always
            # supplies a trailing newline, so `read` sees at least one (empty) line and
            # returns 0 regardless of whether `tar`/`node` above actually produced
            # anything — and `run:` steps execute under `bash -e` WITHOUT `pipefail`, so
            # neither a `tar` extraction failure nor a `node` JSON-parse crash aborts
            # this function on their own. Without this guard, `name`/`version` silently
            # become empty, `npm view "@" version` fails (indistinguishable from "not
            # published"), and the tarball below gets published unconditionally —
            # turning a resumable re-dispatch back into the EPUBLISHCONFLICT abort this
            # function exists to prevent.
            if [ -z "$name" ] || [ -z "$version" ]; then
              echo "::error::could not read name/version from $tgz (unexpected tarball layout?)"
              exit 1
            fi
            # `npm view` exits non-zero for a name@version that has never been published —
            # that is the expected/common case, hence the explicit guard rather than
            # letting `bash -e` treat it as a failure.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published — skipping (resuming a partially-failed publish)"
              return 0
            fi
            echo "::group::npm publish $tgz ($name@$version)"
            npm publish "$tgz"
            echo "::endgroup::"
          }

          shopt -s nullglob
          read -r -a platform_names <<< "$PLATFORM_NAMES_SPACE"
          expected_platform_count=${#platform_names[@]}
          expected_total_count=$((expected_platform_count + 1))
          # `./` is LOAD-BEARING, not style. npm parses a bare relative path containing a slash
          # as a GitHub shorthand: `npm publish dist-npm/x.tgz` resolves to
          # `github:dist-npm/x.tgz` and fails trying to `git ls-remote
          # ssh://git@github.com/dist-npm/x.tgz.git`. The `./` prefix forces the file
          # interpretation. Reproduced locally on 2026-08-30: the bare form errors EALLOWGIT
          # ("Refusing to fetch github:dist-npm/..."), the `./` form reads the tarball and
          # reports the right name and version.
          #
          # This bit the FIRST EVER `publish: true` dispatch (run 33295294957) -- every job
          # before it passed, then the publish died on the first platform package. The path had
          # never been exercised because LCLI-278 prohibited that input, so a bug in the one job
          # that only runs at release time sat here from the day it was written.
          all_tgz=(./dist-npm/*.tgz)
          if [ "${#all_tgz[@]}" -ne "$expected_total_count" ]; then
            echo "::error::expected ${expected_total_count} tarballs in dist-npm (${expected_platform_count} platform + 1 launcher), found ${#all_tgz[@]}"
            ls -la dist-npm
            exit 1
          fi

          root=""
          platform_tgz=()
          for tgz in "${all_tgz[@]}"; do
            is_platform=false
            for name in "${platform_names[@]}"; do
              case "$tgz" in
                *"-${name}-"*) is_platform=true ;;
              esac
            done
            if [ "$is_platform" = true ]; then
              platform_tgz+=("$tgz")
            elif [ -z "$root" ]; then
              root="$tgz"
            else
              echo "::error::found two candidate root/launcher tarballs: $root and $tgz"
              exit 1
            fi
          done
          if [ "${#platform_tgz[@]}" -ne "$expected_platform_count" ] || [ -z "$root" ]; then
            echo "::error::expected ${expected_platform_count} platform tarballs + 1 root tarball, found ${#platform_tgz[@]} platform (root='${root}')"
            ls -la dist-npm
            exit 1
          fi

          # Refuse to publish the pre-release placeholder version. Every other
          # precondition in this workflow fails loud (the npm floor assertion above,
          # the derived tarball-count asserts above and verify-versions' metadata
          # cross-check in the `verify-versions` job) — this is the only irreversible
          # action in the repo, and the First-release checklist deliberately orders
          # Trusted Publisher registration (step 1) BEFORE the version bump (step 2),
          # so a `publish: true` dispatch made between those two steps would otherwise
          # sail through every other check and publish an installable `0.0.0`
          # release, moving `latest` onto it. Checked once against the root
          # tarball (verify-versions already proved every manifest shares one
          # version, so any artifact would do).
          root_version="$(tar -xzOf "$root" package/package.json | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>console.log(JSON.parse(d).version));')"
          if [ -z "$root_version" ] || [ "$root_version" = "0.0.0" ]; then
            echo "::error::refusing to publish version '${root_version}' — 0.0.0 is the pre-release placeholder. Complete the version-bump item in docs/runbooks/release-publishing.md's First-release checklist first."
            exit 1
          fi
          echo "publishing version ${root_version}"

          for tgz in "${platform_tgz[@]}"; do
            publish_or_skip "$tgz"
          done
          publish_or_skip "$root"
      - name: Verify the registry serves what was published (LCLI-460)
        # npm's publish confirmation is authoritative; the registry's READ API is not
        # immediately consistent with it. Observed on @opum-ai/lore-linux-arm64 across three
        # consecutive releases and WORSENING rather than jittering: 0.4.5 ~15s, 0.4.6 ~35s,
        # 0.5.0 ~25 MINUTES (resolved 2026-09-08T14:49:18Z), confirmed origin-side via
        # cf-cache-status/age headers rather than a stale CDN edge. On 0.5.0 the lag ran long
        # enough that a sibling session flagged it as a possible install-breaking defect before
        # it resolved on its own. docs/reference/lore-cli-release-truth.md's 0.5.0 entry has
        # the timeline.
        #
        # TWO DISTINCT FAILURES, and collapsing them is what turns a slow release into a false
        # alarm:
        #   NOT VISIBLE YET  -> propagation. Not a defect. Waiting fixes it.
        #   VISIBLE, WRONG BYTES -> a real failure. Waiting never fixes it.
        # A version-string check cannot tell them apart, and would pass against a registry
        # serving the right version with the wrong tarball. So the content assertion compares
        # the registry's dist.shasum against the sha1 of the tarball THIS JOB published.
        #
        # ONE SHARED WINDOW, NOT ONE PER PACKAGE. The deadline is wall-clock and starts once;
        # every package still missing is re-polled each round against that same deadline. Total
        # wait is bounded at REGISTRY_WINDOW_SECONDS however many packages are outstanding, and
        # each still gets the whole remaining window. Per-package would either be too short for
        # the slowest or serialise seven waits. If a release is paused here: ONE 30-minute
        # window, not seven. 30 minutes because the worst observed was 25 and the trend is up.
        #
        # This step NEVER fails the job for propagation alone -- it reports and exits 0 -- because
        # the publish already succeeded and failing here would attach a red X to a release that is
        # fine, inviting someone to "fix" it destructively. It DOES fail on a content mismatch.
        env:
          REGISTRY_WINDOW_SECONDS: ${{ vars.REGISTRY_WINDOW_SECONDS || 1800 }}
        run: |
          # No associative array on purpose: `declare -A` needs bash 4+, which the runner has
          # but a maintainer's macOS /bin/bash (3.2) does not -- and code in a release path
          # that cannot be run locally cannot be tested locally. The content loop below
          # re-derives name/version from each tarball instead of carrying a map.
          spec_of_tgz() {
            tar -xzOf "$1" package/package.json | node -e '
              let d=""; process.stdin.on("data",c=>d+=c);
              process.stdin.on("end",()=>{const p=JSON.parse(d);console.log(p.name+"@"+p.version);});
            '
          }

          pending=""
          for tgz in ./dist-npm/*.tgz; do
            spec="$(spec_of_tgz "$tgz")"
            case "$spec" in
              ""|"@"|*"@") echo "::error::could not read name/version from $tgz"; exit 1 ;;
            esac
            pending="$pending $spec"
          done
          pending="${pending# }"

          started=$(date +%s)
          deadline=$(( started + REGISTRY_WINDOW_SECONDS ))
          delay=5
          visible=""
          while : ; do
            next=""; missing=0
            for spec in $pending; do
              if npm view "$spec" version >/dev/null 2>&1; then
                echo "visible  $spec after $(( $(date +%s) - started ))s"
                visible="$visible $spec"
              else
                next="$next $spec"; missing=$(( missing + 1 ))
              fi
            done
            pending="${next# }"
            [ -z "$pending" ] && break
            now=$(date +%s)
            [ "$now" -ge "$deadline" ] && break
            nap="$delay"
            [ $(( now + nap )) -gt "$deadline" ] && nap=$(( deadline - now ))
            echo "waiting  ${missing} package(s) not visible yet; $(( deadline - now ))s of the shared window left"
            sleep "$nap"
            if [ "$delay" -lt 60 ]; then
              delay=$(( delay * 2 ))
              if [ "$delay" -gt 60 ]; then delay=60; fi
            fi
          done

          # CONTENT. Only meaningful for what is actually visible; a package still propagating
          # has no bytes to compare yet.
          rc=0
          for tgz in ./dist-npm/*.tgz; do
            spec="$(spec_of_tgz "$tgz")"
            # Skip anything still propagating -- it has no bytes on the registry to compare yet.
            case " ${visible# } " in *" $spec "*) ;; *) continue ;; esac
            want="$(sha1sum "$tgz" | cut -d" " -f1)"
            got="$(npm view "$spec" dist.shasum 2>/dev/null | tr -d "[:space:]")"
            if [ "$want" = "$got" ]; then
              echo "content  $spec matches the published tarball (sha1 $want)"
            else
              echo "::error::$spec is on the registry but serves DIFFERENT BYTES than this job published (published sha1 $want, registry dist.shasum ${got:-<none>}). This is not propagation and waiting will not fix it."
              rc=1
            fi
          done

          if [ -n "$pending" ]; then
            echo "::warning::still not visible on the registry read API after ${REGISTRY_WINDOW_SECONDS}s:${pending}. This is NOT proof the publish failed -- npm already confirmed it, and only the registry read API is behind (LCLI-460: 0.4.5 ~15s, 0.4.6 ~35s, 0.5.0 ~25min). Do NOT unpublish. Re-check before treating it as a failure."
          fi
          exit "$rc"

  provenance-post:
    name: verify this release's own provenance (LCLI-481)
    needs: publish
    # Runs whenever `publish` actually RAN — success or failure — and only skips when publish
    # itself was skipped (the dry-run dispatches, where nothing was published).
    #
    # THE FAILED CASE IS THE ONE THAT MATTERS MOST, which is why this is not a bare `needs:`.
    # release.yml's `publish_or_skip` is resumable precisely so a release can complete across
    # two dispatches: dispatch 1 publishes six platform packages from commit X and dies before
    # the launcher, dispatch 2 publishes the launcher from commit Y. That partial failure is
    # exactly when one version ends up carrying two different pinned commits — and the default
    # `needs:`-only behaviour would skip this check on it.
    if: ${{ !cancelled() && needs.publish.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Bounded: worst case is PROVENANCE_WAIT_SECONDS (180) spent on each of the six packages
    # that could still be propagating, ~18 minutes, and the script only ever waits when at
    # least one package of this release already carries an attestation.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # No `registry-url:` here either — see the note in provenance-pre. This job reads
          # public JSON and must not be handed a registry credential line.
      - name: Check the attestation this release produced, if it produced one (--post)
        # WHAT THIS ANSWERS, and it is two different questions that must not be collapsed:
        #
        #   NO ATTESTATION      -> PASS, with a `::warning::` and a job-summary row naming the
        #                          cause. This is the EXPECTED result right now: OIDC trusted
        #                          publishing is broken for this repo (LCLI-482, still open),
        #                          so releases go out through scripts/publish-release.sh, which
        #                          cannot mint provenance. Failing here would red every release
        #                          for something the release cannot fix, and the gate would be
        #                          switched off within one dispatch. Passing SILENTLY would be
        #                          the opposite mistake — unattested releases would accumulate
        #                          unnoticed — so the gap is recorded on every single run.
        #   ATTESTATION PRESENT,
        #   PINNED COMMIT GONE  -> FAIL. The LCLI-481 defect, caught on the release run rather
        #                          than found later on npmjs.com, where a provenance link to a
        #                          non-existent commit reads as tampering.
        #
        # This CANNOT un-publish anything — by the time it runs the bytes are on the registry.
        # Its value is that the verdict lands on the release run within minutes, while the
        # cause is still obvious, instead of in a bug report months later. It is also the last
        # job in the workflow, so unlike provenance-pre a failure here blocks nothing; there is
        # deliberately no acknowledgement input for it.
        #
        # The package set and version come from the checked-out package.json (root name +
        # every optionalDependencies key). verify-versions has already asserted that those
        # pins are exact and equal to the root version, so that IS this release's package set.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Attestations propagate on the registry's own schedule — the same read-API lag
          # LCLI-460 documents for tarballs (0.5.0 took ~25 minutes to become visible). Without
          # a bounded wait, a genuinely attested release would be reported as unattested purely
          # because the check was fast, which is the one way the "absent is fine" rule could
          # become misleading. The window is PER PACKAGE, and the script skips it entirely when
          # not one package of the release carries an attestation — with LCLI-482 open that is
          # the structural case, and spending 180s per package to re-learn it would make every
          # release slower for nothing.
          PROVENANCE_WAIT_SECONDS: ${{ vars.PROVENANCE_WAIT_SECONDS || 180 }}
        run: node scripts/release-provenance.mjs --post --wait-seconds "$PROVENANCE_WAIT_SECONDS"
