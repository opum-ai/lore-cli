name: CI

on:
  push:
    branches: [dev, main]
  # Unfiltered so PRs to dev (and stacked feature-branch PRs) all get CI.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: "lint · typecheck · test (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      - run: bun run typecheck
      - name: Test
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows runners hit FS/resource pressure under default parallelism (AC#2).
            bun test --isolate --max-concurrency=4 --timeout=30000
          else
            # Isolate test files so suites that mutate global process state can't bleed.
            bun test --isolate --timeout=10000
          fi

  build:
    name: compile smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-bun
      # Lightweight buildability smoke (host-native compile only). The
      # release-grade -baseline per-platform matrix and npm dual-artifact
      # packaging are in .github/workflows/release.yml (LORE-9).
      - name: Compile and smoke-test the binary
        shell: bash
        run: |
          # `--outfile` inside the checkout keeps this on the runner's single filesystem —
          # do not redirect it to a separately-mounted volume/tmpfs: a cross-device rename
          # during `bun build --compile` can silently produce a 0-byte binary at exit 0
          # (see docs/reference/tech-stack.md §1, LORE-14).
          bun build --compile src/cli.ts --outfile dist/lore
          # Assert the binary WORKS, not merely that it exits 0. A broken compile
          # (e.g. the 0-byte binary `bun build --compile` silently emits on some
          # filesystems) exits 0 with empty output, so an exit-code-only smoke is blind.
          version="$(./dist/lore --version)"
          expected="$(bun -e 'console.log(require("./package.json").version)')"
          echo "lore --version => '${version}' (package.json: '${expected}')"
          if [ -z "${version}" ]; then
            echo "::error::lore --version produced no output (broken binary)"; exit 1
          fi
          if [ "${version}" != "${expected}" ]; then
            echo "::error::version mismatch: binary='${version}' package.json='${expected}'"; exit 1
          fi
          # --help exercises the other output path; assert it emits the banner too.
          ./dist/lore --help | grep -q "OKF-native documentation CLI"

  scaffold-mkdocs:
    name: mkdocs scaffold smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - run: pip install "mkdocs>=1.6" "mkdocs-material>=9"
      # Real end-to-end smoke (LORE-39 AC#1): scaffold against this repo's own bundle,
      # then actually build it. A generated-bytes unit test alone can't catch a config
      # setting that mkdocs itself rejects or a plugin that silently no-ops.
      #
      # No --strict: the scaffolded config deliberately tolerates broken-link/anchor
      # WARNINGS (`not_found: warn`, OKF's broken-link tolerance, ADR-0010 §4's known
      # cross-tree `backlog/` and doc-todo limitations) — this asserts the build the
      # shipped config actually produces (exit 0), not a stricter one it never promised.
      - name: Scaffold and build the live bundle
        run: |
          bun src/cli.ts scaffold mkdocs
          mkdocs build --site-dir /tmp/mkdocs-site

  scaffold-docusaurus:
    name: docusaurus scaffold smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # Real end-to-end smoke (LORE-40 AC#1/AC#2): scaffold against this repo's own bundle,
      # then actually build it with real Docusaurus + webpack. A generated-bytes unit test
      # alone can't catch a config setting Docusaurus itself rejects, or the raw `<`/`{` in
      # OKF prose (e.g. `<!-- lore:tasks:begin -->`) being parsed as MDX/JSX and breaking the
      # build — the exact failure mode `markdown.format: 'detect'` exists to prevent.
      #
      # onBrokenLinks/onBrokenAnchors stay at the scaffolded 'warn' (not a stricter override):
      # this asserts the build the shipped config actually produces (exit 0), not one it never
      # promised — OKF's broken-link tolerance means cross-tree `backlog/`/`../../lore-spec.md`
      # style links are expected warnings, not failures (consumer-compatibility.md §4).
      - name: Scaffold and build the live bundle
        run: |
          bun src/cli.ts scaffold docusaurus
          cd website
          npm install
          npm run build

  docker-e2e:
    name: docker e2e harness (real lore + backlog binaries)
    runs-on: ubuntu-latest
    # A full cold build (Backlog.md clone + build, lore compile, apt/pip/npm installs) plus
    # ~300 real-binary assertions is bounded well below the 360m default so a genuinely hung
    # step (e.g. a stalled network fetch) fails fast instead of silently eating the whole
    # job-timeout budget. 45m (not 30m): this has never been measured on an actual GH-hosted
    # 2-core ubuntu runner -- every run here is a full cold build with no docker layer cache,
    # so local/dev-machine timing doesn't transfer. Re-tighten once real runner timing is
    # observed.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The ~1500-line hermetic E2E harness under docker/e2e/ (LORE-56..68) builds real `lore`
      # and `backlog` binaries and drives the full `lore` command surface against a real,
      # mutating backlog project — no mocked adapter (ADR-0002). It was previously runnable
      # only by hand (docs/runbooks/docker-e2e-testing-environment.md) and never wired into
      # any workflow, so a regression anywhere it covers (LORE-61..68) could merge cleanly
      # (LORE-100). `--exit-code-from e2e` is required, not cosmetic: plain `docker compose
      # up` always exits 0 regardless of the service's own exit code (LORE-104), which would
      # silently turn this into a no-op smoke test that never fails the job.
      # PUID/PGID must match the runner's real uid/gid: ubuntu-latest runs as 1001:1001,
      # not the container's default 1000:1000 (docker-compose.yml's own header documents
      # this exact invocation). Without it, every write to the bind-mounted
      # docker/e2e/results/report.jsonl EACCESes (that dir is tracked via .gitkeep and
      # checked out owned by the runner's uid), and run-e2e.sh Phase 25 deliberately exits
      # 1 whenever REPORT_WRITE_FAILURES>0 (LORE-103 AC1) — so the job fails even when
      # every scenario passes, and the report artifact never exists on the host.
      - name: Build and run the E2E harness
        run: PUID="$(id -u)" PGID="$(id -g)" docker compose -f docker/e2e/docker-compose.yml up --build --exit-code-from e2e
      # Always attempt this (even after a failing run above) — the structured
      # docker/e2e/results/report.jsonl (one JSON object per step) is the fastest way to see
      # which scenario(s) failed without re-running the whole harness locally. Best-effort:
      # a build-time failure (before run-e2e.sh's entrypoint ever executes) leaves no report
      # file, so a missing file here is expected, not itself a workflow failure.
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-e2e-report
          path: docker/e2e/results/report.jsonl
          if-no-files-found: warn
