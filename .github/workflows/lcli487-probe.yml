# TEMPORARY probe for LCLI-487 — DELETE BEFORE THIS BRANCH LANDS.
#
# Question it answers, which no amount of reading the docs settles: on a PARTIAL re-run
# (`gh run rerun --failed`), does a STABLE artifact name plus `overwrite: true` let the
# consumer see BOTH a re-run job's fresh artifact AND a non-re-run job's surviving one?
name: LCLI-487 probe
on:
  push:
    branches: [fix/LCLI-487-partial-rerun-artifacts]
permissions:
  contents: read
jobs:
  stable-producer:
    # Succeeds on every attempt, so `--failed` will NOT re-run it. Its artifact must survive
    # into the second attempt and still be findable under a name with no attempt in it.
    name: probe producer (always green)
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          echo "produced on attempt ${{ github.run_attempt }}" > out/producer.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-producer-${{ github.run_id }}
          path: out/
          overwrite: true

  flaky-producer:
    # Fails on attempt 1 and passes afterwards, standing in for the genuinely flaky Ladybug
    # concurrency job that motivates this task.
    name: probe producer (fails on attempt 1)
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          echo "produced on attempt ${{ github.run_attempt }}" > out/flaky.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-flaky-${{ github.run_id }}
          path: out/
          overwrite: true
      - name: Fail on the first attempt only
        run: |
          if [ "${{ github.run_attempt }}" = "1" ]; then
            echo "::error::deliberate first-attempt failure (LCLI-487 probe)"
            exit 1
          fi
          echo "attempt ${{ github.run_attempt }}: passing"

  consumer:
    name: probe consumer (must see both)
    needs: [stable-producer, flaky-producer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: probe-producer-${{ github.run_id }}
          path: dl/producer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: probe-flaky-${{ github.run_id }}
          path: dl/flaky
      - run: |
          echo "consumer running on attempt ${{ github.run_attempt }}"
          echo "producer artifact says: $(cat dl/producer/producer.txt)"
          echo "flaky artifact says:    $(cat dl/flaky/flaky.txt)"
